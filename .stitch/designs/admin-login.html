<!DOCTYPE html>

<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Login Page - Laptop Store</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b6cee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0d1117",
                        "surface-dark": "#161b22",
                        "border-dark": "#30363d",
                        "text-muted": "#8b949e",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .grid-bg {
            background-image: linear-gradient(to right, rgba(48, 54, 61, 0.2) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(48, 54, 61, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .neon-border {
            box-shadow: 0 0 15px rgba(43, 108, 238, 0.1), inset 0 0 0 1px rgba(43, 108, 238, 0.2);
        }
        .neon-button {
            box-shadow: 0 0 20px rgba(43, 108, 238, 0.3);
        }
        .neon-button:hover {
            box-shadow: 0 0 25px rgba(43, 108, 238, 0.5);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 grid-bg pointer-events-none"></div>
<div class="relative w-full max-w-md p-8 bg-white dark:bg-surface-dark rounded-xl neon-border z-10 mx-4">
<div class="flex flex-col items-center mb-8">
<div class="flex items-center justify-center w-12 h-12 rounded-lg bg-primary/20 text-primary mb-4">
<span class="material-symbols-outlined text-3xl">laptop_mac</span>
</div>
<h1 class="text-2xl font-bold text-center tracking-tight text-slate-900 dark:text-white">
                Đăng Nhập Quản Trị
            </h1>
<p class="text-sm text-text-muted mt-2 text-center">
                Premium Laptop Store Admin Portal
            </p>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2" for="username">
                    Username
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted text-lg">person</span>
</div>
<input class="form-input block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-border-dark rounded-lg bg-transparent text-slate-900 dark:text-white placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" id="username" placeholder="Nhập tên đăng nhập" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2" for="password">
                    Password
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted text-lg">lock</span>
</div>
<input class="form-input block w-full pl-10 pr-10 py-3 border border-slate-300 dark:border-border-dark rounded-lg bg-transparent text-slate-900 dark:text-white placeholder-text-muted focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" id="password" placeholder="Nhập mật khẩu" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-text-muted hover:text-slate-900 dark:hover:text-white focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background-dark transition-all neon-button" type="submit">
                    Đăng Nhập
                </button>
</div>
</form>
<div class="mt-8 text-center border-t border-slate-200 dark:border-border-dark pt-6">
<div class="flex items-center justify-center text-xs text-text-muted">
<span class="material-symbols-outlined text-sm mr-1">security</span>
<span>Khu vực an ninh. Truy cập trái phép sẽ bị ghi nhận.</span>
</div>
</div>
</div>
</body></html>
