<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin Login - TechShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: { colors: { "primary": "#2b6cee", "background-dark": "#101622" } } }
        }
    </script>
</head>
<body class="bg-background-dark text-white font-display min-h-screen flex items-center justify-center">
    
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 w-full max-w-sm shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Admin Login</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Username</label>
                <input id="username" type="text" value="admin" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-primary transition-colors text-white">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-400">Password</label>
                <input id="password" type="password" value="admin123" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-primary transition-colors text-white">
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-lg mt-2 transition-all shadow-lg shadow-blue-500/20">
                Đăng Nhập
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center hidden">Tài khoản hoặc mật khẩu không đúng!</p>
        </form>
    </div>

    <script type="module">
        import { setAdminToken, login } from './api.js';

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btn = document.getElementById('btn-submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin inline-block mr-2">⟳</span> Đang xử lý...';

            try {
                const res = await login(u, p);
                console.log(res); // Debug
                if (res.token) {
                    setAdminToken(res.token);
                    window.location.href = 'admin.html';
                } else {
                    throw new Error('Đăng nhập thất bại');
                }
            } catch (err) {
                console.error(err);
                const detail = err.message || 'Lỗi đăng nhập';
                errorMsg.textContent = detail.includes('Failed') ? 'Lỗi kết nối Server' : detail;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Đăng Nhập';
            }
        });
    </script>
</body>
</html>
