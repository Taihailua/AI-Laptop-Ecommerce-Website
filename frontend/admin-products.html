<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Quản lý sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#2b6cee", "background-light": "#f6f6f8", "background-dark": "#101622" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-slate-900 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
            <h1 class="text-xl font-bold">Admin Dashboard</h1>
        </div>
        <div class="flex gap-4">
            <a href="admin.html" class="text-slate-500 hover:text-primary font-medium">Đơn hàng</a>
            <a href="admin-tickets.html" class="text-slate-500 hover:text-primary font-medium">Ticket CSKH</a>
            <a href="admin-products.html" class="text-primary font-bold border-b-2 border-primary">Sản phẩm</a>
            <a href="admin-kb.html" class="text-slate-500 hover:text-primary font-medium">Support KB</a>
            <button id="logout-btn" class="text-red-500 hover:text-red-600 font-medium flex items-center gap-1">
                <span class="material-symbols-outlined text-lg">logout</span> Thoát
            </button>
        </div>
    </header>

    <main class="p-6 lg:p-10 max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Danh sách sản phẩm</h2>
            <button id="open-modal-btn" class="bg-primary hover:bg-blue-600 text-white px-4 py-2.5 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-blue-500/20 transition-all">
                <span class="material-symbols-outlined">add</span> Thêm mới
            </button>
        </div>

        <!-- Product Table -->
        <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800">
                        <tr>
                            <th class="px-6 py-4 font-semibold text-sm">ID</th>
                            <th class="px-6 py-4 font-semibold text-sm">Sản phẩm</th>
                            <th class="px-6 py-4 font-semibold text-sm">Hãng</th>
                            <th class="px-6 py-4 font-semibold text-sm">Giá (VND)</th>
                            <th class="px-6 py-4 font-semibold text-sm">Tồn kho</th>
                            <th class="px-6 py-4 font-semibold text-sm">Trạng thái KD</th>
                            <th class="px-6 py-4 font-semibold text-sm text-right">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="product-list" class="divide-y divide-slate-100 dark:divide-slate-800">
                        <tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-900 rounded-xl w-full max-w-lg p-6 shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold">Thêm Sản Phẩm Mới</h3>
                <button id="close-modal-btn" class="text-slate-500 hover:text-red-500">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <form id="add-form" class="flex flex-col gap-4">
                <input type="hidden" name="id" id="product_id">
                <div>
                    <label class="block text-sm font-medium mb-1">Tên sản phẩm *</label>
                    <input name="name" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Hãng *</label>
                        <input name="brand" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Giá (VNĐ) *</label>
                        <input name="price" type="number" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Số lượng tồn kho</label>
                    <input name="stock_quantity" type="number" value="10" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none">
                </div>
                
                <div class="grid grid-cols-1 gap-2">
                    <label class="block text-sm font-medium">Hình ảnh</label>
                    
                    <div class="border border-dashed border-slate-300 dark:border-slate-700 rounded-lg p-4 text-center">
                        <label class="cursor-pointer block">
                            <span class="material-symbols-outlined text-3xl text-slate-400">cloud_upload</span>
                            <p class="text-sm text-slate-500">Tải ảnh lên</p>
                            <input type="file" name="image_file" accept="image/*" class="hidden" onchange="document.getElementById('file-name').textContent = this.files[0]?.name || ''">
                        </label>
                        <p id="file-name" class="text-xs text-primary mt-2 font-medium"></p>
                    </div>

                    <p class="text-center text-xs text-slate-400">- HOẶC -</p>
                    
                    <input name="image_url" placeholder="Dán link ảnh (URL)" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2.5 outline-none text-sm">
                </div>
                
                <div class="p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg border border-slate-200 dark:border-slate-800">
                    <p class="text-sm font-bold mb-2">Cấu hình chi tiết (Optional)</p>
                    <textarea
                        name="specs_text"
                        rows="5"
                        placeholder="Nhập mỗi dòng theo dạng: Tên thông số: Giá trị&#10;Ví dụ:&#10;CPU: Intel Core i5-1240P&#10;RAM: 16GB&#10;Ổ cứng: 512GB SSD"
                        class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-primary"
                    ></textarea>
                </div>

                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" id="cancel-btn" class="px-5 py-2.5 text-slate-500 font-medium hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">Hủy</button>
                    <button type="submit" class="px-5 py-2.5 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg shadow-blue-500/20 transition-all">Lưu Sản Phẩm</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { fetchProducts, createProduct, updateProduct, deleteProduct, setProductBusinessPaused, getAdminToken, clearAdminToken } from './api.js';

        // Auth Check
        /* if (!getAdminToken()) window.location.href = 'admin-login.html'; */

        let currentProducts = [];

        function isProductPaused(product) {
            const specs = product?.specs;
            if (!specs || typeof specs !== 'object') return false;
            const raw = specs.__business_paused__;
            if (typeof raw === 'string') {
                return ['1', 'true', 'yes', 'on'].includes(raw.trim().toLowerCase());
            }
            return Boolean(raw);
        }

        document.getElementById('logout-btn').onclick = function() {
            clearAdminToken();
            window.location.href = 'index.html';
        }

        // --- Load Products ---
        async function load() {
            const tbody = document.getElementById('product-list');
            try {
                const products = await fetchProducts({ includePaused: true });
                currentProducts = products;
                
                if(!products || !products.length) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-slate-500">Chưa có sản phẩm nào.</td></tr>';
                    return;
                }
                
                tbody.innerHTML = products.map(p => `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors border-b border-slate-100 dark:border-slate-800 last:border-0 group">
                        <td class="px-6 py-4 text-sm font-medium opacity-60">#${p.id}</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center overflow-hidden p-1">
                                    ${p.image_url 
                                        ? `<img src="${p.image_url}" class="w-full h-full object-contain">` 
                                        : `<span class="material-symbols-outlined text-slate-300">laptop_mac</span>`
                                    }
                                </div>
                                <span class="font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors">${p.name}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm">${p.brand || '-'}</td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900 dark:text-white">${new Intl.NumberFormat('vi-VN').format(p.price)} ₫</td>
                        <td class="px-6 py-4">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${p.stock_quantity > 0 ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700'}">
                                ${p.stock_quantity > 0 ? `${p.stock_quantity} Chiếc` : 'Hết hàng'}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            ${isProductPaused(p)
                                ? '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300">Tạm ngừng</span>'
                                : '<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-300">Đang kinh doanh</span>'
                            }
                        </td>
                        <td class="px-6 py-4 text-right flex justify-end gap-2">
                           <button onclick="toggleBusiness(${p.id})" class="p-2 text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-900/20 rounded-lg transition-all" title="${isProductPaused(p) ? 'Mở bán lại' : 'Tạm ngừng kinh doanh'}">
                                <span class="material-symbols-outlined text-[20px]">${isProductPaused(p) ? 'play_circle' : 'pause_circle'}</span>
                           </button>
                           <button onclick="openModal(${p.id})" class="p-2 text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-lg transition-all" title="Sửa">
                                <span class="material-symbols-outlined text-[20px]">edit</span>
                           </button>
                           <button onclick="handleDelete(${p.id})" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-all" title="Xóa">
                                <span class="material-symbols-outlined text-[20px]">delete</span>
                           </button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-red-500">Lỗi: ${e.message}</td></tr>`;
            }
        }

        window.toggleBusiness = async function(id) {
            const product = currentProducts.find(p => p.id === id);
            if (!product) return;

            const paused = isProductPaused(product);
            const nextPaused = !paused;
            const confirmText = nextPaused
                ? 'Tạm ngừng kinh doanh sản phẩm này? Sản phẩm sẽ không hiển thị ở trang khách mua.'
                : 'Mở bán lại sản phẩm này?';

            if (!confirm(confirmText)) return;

            try {
                await setProductBusinessPaused(id, nextPaused);
                await load();
                alert(nextPaused ? 'Đã tạm ngừng kinh doanh sản phẩm.' : 'Đã mở bán lại sản phẩm.');
            } catch (e) {
                console.error(e);
                alert('Lỗi: ' + e.message);
            }
        }

        // --- Delete Logic ---
        window.handleDelete = async function(id) {
            if(!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
            try {
                await deleteProduct(id);
                load(); 
                alert('Đã xóa thành công!');
            } catch(e) { 
                console.error(e); 
                alert('Lỗi: ' + e.message); 
            }
        }

        // --- Modal Logic ---
        const modal = document.getElementById('modal');
        const form = document.getElementById('add-form');
        const modalTitle = document.getElementById('modal-title');

        function specsObjectToText(specs) {
            if (!specs || typeof specs !== 'object') return '';
            return Object.entries(specs)
                .filter(([k]) => !String(k || '').startsWith('__'))
                .filter(([k, v]) => String(k || '').trim() && String(v || '').trim())
                .map(([k, v]) => `${k}: ${v}`)
                .join('\n');
        }

        function parseSpecsTextToObject(text) {
            const specs = {};
            const rawLines = String(text || '').split(/\r?\n/);

            for (const line of rawLines) {
                const cleanedLine = line.trim();
                if (!cleanedLine) continue;

                const separatorIndex = cleanedLine.indexOf(':');
                if (separatorIndex === -1) continue;

                const key = cleanedLine.slice(0, separatorIndex).trim();
                const value = cleanedLine.slice(separatorIndex + 1).trim();
                if (key && value) {
                    specs[key] = value;
                }
            }

            return Object.keys(specs).length ? specs : null;
        }

        window.openModal = function(productId = null) {
            modal.classList.remove('hidden');
            document.getElementById('file-name').textContent = '';
            
            if (productId) {
                // Edit Mode
                const product = currentProducts.find(p => p.id === productId);
                if (!product) return;

                modalTitle.textContent = 'Chỉnh Sửa Sản Phẩm';
                form.reset();
                
                // Populate fields
                document.getElementById('product_id').value = product.id;
                form.elements['name'].value = product.name;
                form.elements['brand'].value = product.brand;
                form.elements['price'].value = product.price;
                form.elements['stock_quantity'].value = product.stock_quantity;
                form.elements['image_url'].value = product.image_url || '';
                
                // Specs
                form.elements['specs_text'].value = specsObjectToText(product.specs);

            } else {
                // Add Mode
                modalTitle.textContent = 'Thêm Sản Phẩm Mới';
                form.reset();
                document.getElementById('product_id').value = '';
            }
        }

        function closeModal() {
            modal.classList.add('hidden');
            form.reset();
        }

        document.getElementById('open-modal-btn').onclick = () => openModal();
        document.getElementById('close-modal-btn').onclick = closeModal;
        document.getElementById('cancel-btn').onclick = closeModal;

        // --- Form Logic ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const id = formData.get('id');

            // Handle specs
            const parsedSpecs = parseSpecsTextToObject(formData.get('specs_text'));
            if (parsedSpecs) {
                formData.set('specs', JSON.stringify(parsedSpecs));
            } else {
                formData.delete('specs');
            }
            formData.delete('specs_text');

            try {
                if (id) {
                    await updateProduct(id, formData);
                    alert('Cập nhật sản phẩm thành công!');
                } else {
                    formData.delete('id'); // Ensure no empty ID sent
                    await createProduct(formData);
                    alert('Thêm sản phẩm thành công!');
                }
                closeModal();
                load();
            } catch(err) {
                console.error(err);
                alert('Lỗi: ' + err.message);
            }
        });

        load();
    </script>
</body>
</html>
