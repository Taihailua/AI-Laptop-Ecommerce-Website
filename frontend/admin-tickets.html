<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Quản lý ticket CSKH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#2b6cee", "background-light": "#f6f6f8", "background-dark": "#101622" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"] },
                }
            }
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">
    <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-slate-900 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">support_agent</span>
            <h1 class="text-xl font-bold">Admin Dashboard</h1>
        </div>
        <div class="flex gap-4">
            <a href="admin.html" class="text-slate-500 hover:text-primary font-medium">Đơn hàng</a>
            <a href="admin-tickets.html" class="text-primary font-bold border-b-2 border-primary">Ticket CSKH</a>
            <a href="admin-products.html" class="text-slate-500 hover:text-primary font-medium">Sản phẩm</a>
            <a href="admin-kb.html" class="text-slate-500 hover:text-primary font-medium">Support KB</a>
            <button id="logout-btn" class="text-red-500 hover:text-red-600 font-medium flex items-center gap-1">
                <span class="material-symbols-outlined text-lg">logout</span> Thoát
            </button>
        </div>
    </header>

    <main class="p-6 lg:p-10 max-w-[1400px] mx-auto space-y-6">
        <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <h2 class="text-2xl font-bold">Quản lý CSKH theo Khách hàng</h2>
            <div class="flex items-center gap-3">
                <select id="status-filter" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-primary">
                    <option value="">Tất cả trạng thái</option>
                    <option value="Moi">Mới</option>
                    <option value="Dang xu ly">Đang xử lý</option>
                    <option value="Da giai quyet">Đã giải quyết</option>
                    <option value="Da dong">Đã đóng</option>
                </select>
                <button id="reload-btn" class="bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold">Tải lại</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <aside class="lg:col-span-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <h3 class="font-bold">Danh sách khách hàng</h3>
                    <span id="customer-count" class="text-xs text-slate-500">0 khách</span>
                </div>
                <div id="customer-list" class="max-h-[72vh] overflow-y-auto">
                    <div class="text-center py-10 text-slate-500">Đang tải khách hàng...</div>
                </div>
            </aside>

            <section class="lg:col-span-8 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                <div id="customer-detail" class="p-5">
                    <div class="text-center py-10 text-slate-500">Chọn một khách hàng để xem lịch sử CSKH.</div>
                </div>
            </section>
        </div>
    </main>

    <script type="module">
        import { fetchAdminTickets, updateAdminTicket, clearAdminToken } from './api.js';

        const STATUS_LABEL = {
            'Moi': 'Mới',
            'Dang xu ly': 'Đang xử lý',
            'Da giai quyet': 'Đã giải quyết',
            'Da dong': 'Đã đóng'
        };

        const CATEGORY_LABEL = {
            'Tu van san pham': 'Tư vấn sản phẩm',
            'Theo doi don hang': 'Theo dõi đơn hàng',
            'Doi tra hoan tien': 'Đổi trả hoàn tiền',
            'Van de thanh toan': 'Vấn đề thanh toán',
            'Ho tro ky thuat': 'Hỗ trợ kỹ thuật',
            'Khieu nai': 'Khiếu nại',
            'Khac': 'Khác'
        };

        const STATUS_BADGE = {
            'Moi': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400',
            'Dang xu ly': 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400',
            'Da giai quyet': 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400',
            'Da dong': 'bg-slate-100 text-slate-800 dark:bg-slate-700 dark:text-slate-200'
        };

        const ACTION_LABEL = {
            ticket_created: 'Ticket được tạo',
            status_changed: 'Thay đổi trạng thái',
            satisfaction_submitted: 'Khách gửi đánh giá',
            customer_feedback: 'Khách góp ý',
            ai_satisfaction_assessed: 'AI đánh giá mức hài lòng',
            admin_updated_ticket: 'Admin cập nhật ticket'
        };

        const customerListEl = document.getElementById('customer-list');
        const customerCountEl = document.getElementById('customer-count');
        const customerDetailEl = document.getElementById('customer-detail');
        const statusFilterEl = document.getElementById('status-filter');
        let allTickets = [];
        let customerGroups = [];
        let selectedCustomerKey = null;

        document.getElementById('logout-btn').onclick = function() {
            clearAdminToken();
            window.location.href = 'index.html';
        };

        document.getElementById('reload-btn').onclick = function() {
            loadTickets();
        };

        statusFilterEl.onchange = function() {
            loadTickets();
        };

        function escapeHtml(text = '') {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatDateTime(value) {
            if (!value) return 'N/A';
            try {
                return new Date(value).toLocaleString('vi-VN');
            } catch (_) {
                return String(value);
            }
        }

        function displayStatus(status) {
            return STATUS_LABEL[status] || status || '-';
        }

        function displayCategory(category) {
            return CATEGORY_LABEL[category] || category || '-';
        }

        function extractMediaUrls(text = '') {
            const raw = String(text || '');
            const urls = [];
            const re = /(https?:\/\/[^\s,]+|\/static\/[^\s,]+)[^\s,]*\.(?:jpg|jpeg|png|webp|mp4)(?:\?[^\s,]*)?/ig;
            let m;
            while ((m = re.exec(raw)) !== null) {
                urls.push(m[0]);
            }
            return Array.from(new Set(urls));
        }

        function renderMediaUrls(urls = []) {
            if (!Array.isArray(urls) || !urls.length) return '';

            return urls
                .map((url) => {
                    const lower = String(url || '').toLowerCase();
                    if (lower.includes('.mp4')) {
                        return `
                            <div class="mt-1">
                                <a href="${escapeHtml(url)}" target="_blank" class="text-primary underline text-xs font-semibold">Mở video</a>
                            </div>
                        `;
                    }

                    // Default: treat as image
                    return `
                        <div class="mt-1">
                            <a href="${escapeHtml(url)}" target="_blank">
                                <img src="${escapeHtml(url)}" alt="bằng chứng" class="w-24 h-16 object-cover rounded border border-slate-200 dark:border-slate-700" loading="lazy"/>
                            </a>
                        </div>
                    `;
                })
                .join('');
        }

        function renderTicketMessageContent(message = '') {
            const raw = String(message || '');
            const lines = raw.split(/\r?\n/);
            const bangLineIndex = lines.findIndex((l) => /^\s*BANG_CHUNG\s*:/i.test(l));

            let urls = [];
            let description = raw;

            if (bangLineIndex !== -1) {
                const part = lines[bangLineIndex].replace(/^\s*BANG_CHUNG\s*:\s*/i, '');
                urls = part.split(',').map((s) => s.trim()).filter(Boolean);
                description = lines.slice(0, bangLineIndex).join('\n').trim();
            } else {
                urls = extractMediaUrls(raw);
                description = raw;
                if (urls.length) {
                    for (const url of urls) {
                        description = description.replaceAll(url, '');
                    }
                    description = description.trim();
                }
            }

            const descBlock = description
                ? `<p class="mt-1 text-slate-600 dark:text-slate-300 whitespace-pre-wrap">${escapeHtml(description)}</p>`
                : '';
            const mediaBlock = urls.length ? `<div class="mt-2">${renderMediaUrls(urls)}</div>` : '';
            return `${descBlock}${mediaBlock}`;
        }

        function collectCustomerEvidence(ticket) {
            const messages = Array.isArray(ticket?.messages) ? ticket.messages : [];
            const customerMessages = messages.filter((m) => (m?.role || '') === 'human');

            const urls = [];
            for (const msg of customerMessages) {
                const text = String(msg?.message || '');
                const lines = text.split(/\r?\n/);
                const bangLineIndex = lines.findIndex((l) => /^\s*BANG_CHUNG\s*:/i.test(l));
                if (bangLineIndex !== -1) {
                    const part = lines[bangLineIndex].replace(/^\s*BANG_CHUNG\s*:\s*/i, '');
                    const extracted = part.split(',').map((s) => s.trim()).filter(Boolean);
                    urls.push(...extracted);
                } else {
                    urls.push(...extractMediaUrls(text));
                }
            }

            const unique = Array.from(new Set(urls.filter(Boolean)));
            const images = unique.filter((u) => /\.(jpg|jpeg|png|webp)(\?|$)/i.test(u));
            const videos = unique.filter((u) => /\.mp4(\?|$)/i.test(u));
            return { images, videos };
        }

        function renderCustomerEvidence(ticket) {
            const { images, videos } = collectCustomerEvidence(ticket);

            if ((!images || !images.length) && (!videos || !videos.length)) {
                return '<p class="text-sm text-slate-500">Chưa có minh chứng.</p>';
            }

            const imageHtml = images && images.length
                ? `
                    <div>
                        <p class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Ảnh (${images.length})</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${images.map((url) => `
                                <a href="${escapeHtml(url)}" target="_blank" class="block">
                                    <img src="${escapeHtml(url)}" alt="minh chứng" class="w-full h-20 object-cover rounded border border-slate-200 dark:border-slate-700" loading="lazy"/>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `
                : '';

            const videoHtml = videos && videos.length
                ? `
                    <div class="mt-3">
                        <p class="text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Video (${videos.length})</p>
                        <div class="space-y-2">
                            ${videos.map((url) => `
                                <div class="border border-slate-200 dark:border-slate-700 rounded-lg p-2 bg-white/60 dark:bg-slate-900/40">
                                    <video controls preload="metadata" class="w-full rounded max-h-40">
                                        <source src="${escapeHtml(url)}" type="video/mp4" />
                                    </video>
                                    <a href="${escapeHtml(url)}" target="_blank" class="mt-1 inline-block text-xs text-primary underline font-semibold">Mở video tab mới</a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `
                : '';

            return `${imageHtml}${videoHtml}`;
        }

        function renderMessages(ticket) {
            const messages = Array.isArray(ticket.messages) ? ticket.messages.slice(-6) : [];
            if (!messages.length) {
                return '<p class="text-sm text-slate-500">Chưa có nội dung hội thoại.</p>';
            }

            return messages.map((msg) => {
                const roleLabel = msg.role === 'human' ? 'Khách' : (msg.role === 'ai' ? 'AI' : msg.role);
                return `
                    <div class="text-sm border border-slate-200 dark:border-slate-700 rounded-md p-2 bg-white dark:bg-slate-900">
                        <p class="font-semibold text-slate-700 dark:text-slate-200">${escapeHtml(roleLabel)} <span class="font-normal text-xs text-slate-500">${escapeHtml(formatDateTime(msg.created_at))}</span></p>
                        ${renderTicketMessageContent(msg.message || '')}
                    </div>
                `;
            }).join('');
        }

        function renderActivities(ticket) {
            const activities = Array.isArray(ticket.activities) ? ticket.activities : [];
            if (!activities.length) {
                return '<p class="text-sm text-slate-500">Chưa có lịch sử xử lý.</p>';
            }

            const sortedActivities = activities
                .slice()
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let hasShownAiAssessment = false;
            const dedupedActivities = [];
            for (const act of sortedActivities) {
                if (act.action === 'ai_satisfaction_assessed') {
                    if (hasShownAiAssessment) continue;
                    hasShownAiAssessment = true;
                }
                dedupedActivities.push(act);
            }

            return dedupedActivities
                .slice(0, 8)
                .map((act) => {
                    const statusChange = act.old_status || act.new_status
                        ? `${displayStatus(act.old_status)} -> ${displayStatus(act.new_status)}`
                        : '-';
                    return `
                        <div class="text-sm border border-slate-200 dark:border-slate-700 rounded-md p-2 bg-slate-50 dark:bg-slate-800/60">
                            <p class="font-semibold text-slate-700 dark:text-slate-200">${escapeHtml(ACTION_LABEL[act.action] || act.action)} <span class="font-normal text-xs text-slate-500">(${escapeHtml(act.actor || 'system')})</span></p>
                            <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(formatDateTime(act.created_at))}</p>
                            <p class="text-xs mt-1 text-slate-600 dark:text-slate-300">Trạng thái: ${escapeHtml(statusChange)}</p>
                            ${act.note ? `<p class="mt-1 text-slate-600 dark:text-slate-300">${escapeHtml(act.note)}</p>` : ''}
                        </div>
                    `;
                })
                .join('');
        }

        function getCustomerGroupKey(ticket) {
            const phone = ticket.customer?.phone_number || '';
            if (phone) return `phone:${phone}`;
            return `guest:${ticket.customer_id || ticket.id}`;
        }

        function buildCustomerGroups(tickets) {
            const grouped = new Map();

            for (const ticket of tickets) {
                const key = getCustomerGroupKey(ticket);
                if (!grouped.has(key)) {
                    grouped.set(key, {
                        key,
                        customerName: ticket.customer?.full_name || 'Khách vãng lai',
                        phoneNumber: ticket.customer?.phone_number || 'N/A',
                        address: ticket.customer?.address || '',
                        tickets: []
                    });
                }
                grouped.get(key).tickets.push(ticket);
            }

            const groups = Array.from(grouped.values()).map((group) => {
                group.tickets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                group.latestUpdatedAt = group.tickets[0]?.updated_at || null;
                return group;
            });

            groups.sort((a, b) => new Date(b.latestUpdatedAt || 0) - new Date(a.latestUpdatedAt || 0));
            return groups;
        }

        function renderCustomerList(groups) {
            customerCountEl.textContent = `${groups.length} khách`;
            if (!groups.length) {
                customerListEl.innerHTML = '<div class="text-center py-10 text-slate-500">Không có khách hàng phù hợp bộ lọc.</div>';
                customerDetailEl.innerHTML = '<div class="text-center py-10 text-slate-500">Không có dữ liệu để hiển thị.</div>';
                return;
            }

            if (!selectedCustomerKey || !groups.some((g) => g.key === selectedCustomerKey)) {
                selectedCustomerKey = groups[0].key;
            }

            customerListEl.innerHTML = groups.map((group) => {
                const isActive = group.key === selectedCustomerKey;
                return `
                    <button data-customer-key="${escapeHtml(group.key)}" class="customer-item w-full text-left px-4 py-3 border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/60 ${isActive ? 'bg-primary/10' : ''}">
                        <p class="font-semibold text-sm text-slate-900 dark:text-white">${escapeHtml(group.customerName)}</p>
                        <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(group.phoneNumber)}</p>
                        <p class="text-xs text-slate-500 mt-0.5">${group.tickets.length} ticket • Cập nhật ${escapeHtml(formatDateTime(group.latestUpdatedAt))}</p>
                    </button>
                `;
            }).join('');

            customerListEl.querySelectorAll('.customer-item').forEach((btn) => {
                btn.addEventListener('click', () => {
                    selectedCustomerKey = btn.dataset.customerKey;
                    renderCustomerList(customerGroups);
                    renderCustomerDetail(selectedCustomerKey);
                });
            });

            renderCustomerDetail(selectedCustomerKey);
        }

        function renderTicketCard(ticket) {
            const customerName = ticket.customer?.full_name || 'Khách vãng lai';
            const customerPhone = ticket.customer?.phone_number || 'N/A';
            const noteId = `note_${ticket.id}`;
            const actorId = `actor_${ticket.id}`;
            const selectId = `status_${ticket.id}`;
            const aiSatId = `ai_sat_${ticket.id}`;

            const latestAiAssessment = (Array.isArray(ticket.activities) ? ticket.activities : [])
                .filter((act) => act.action === 'ai_satisfaction_assessed' && act.note)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            const aiSatText = latestAiAssessment
                ? `${latestAiAssessment.note} (${formatDateTime(latestAiAssessment.created_at)})`
                : 'Chưa có đánh giá tự động';

            return `
                <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex flex-col xl:flex-row xl:items-center xl:justify-between gap-4">
                        <div>
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="font-bold text-lg">Ticket #${ticket.id}</h3>
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${STATUS_BADGE[ticket.status] || 'bg-slate-100 text-slate-700'}">${STATUS_LABEL[ticket.status] || ticket.status}</span>
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">${escapeHtml(displayCategory(ticket.category))}</span>
                            </div>
                            <p class="text-sm text-slate-500 mt-1">${escapeHtml(ticket.subject || 'Yêu cầu hỗ trợ')} • ${escapeHtml(customerName)} • ${escapeHtml(customerPhone)}</p>
                            <p class="text-xs text-slate-500 mt-1">Tạo lúc: ${escapeHtml(formatDateTime(ticket.created_at))} • Cập nhật: ${escapeHtml(formatDateTime(ticket.updated_at))}</p>
                        </div>
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                            <select id="${selectId}" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-sm px-3 py-2 outline-none">
                                <option value="Moi" ${ticket.status === 'Moi' ? 'selected' : ''}>Mới</option>
                                <option value="Dang xu ly" ${ticket.status === 'Dang xu ly' ? 'selected' : ''}>Đang xử lý</option>
                                <option value="Da giai quyet" ${ticket.status === 'Da giai quyet' ? 'selected' : ''}>Đã giải quyết</option>
                                <option value="Da dong" ${ticket.status === 'Da dong' ? 'selected' : ''}>Đã đóng</option>
                            </select>
                            <input id="${actorId}" placeholder="Người xử lý (vd: admin1)" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-sm px-3 py-2 outline-none"/>
                            <button data-ticket-id="${ticket.id}" class="btn-update bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Cập nhật</button>
                        </div>
                    </div>
                    <div class="p-5 bg-slate-50 dark:bg-slate-800/20 grid grid-cols-1 xl:grid-cols-3 gap-4">
                        <div>
                            <h4 class="font-semibold mb-2">Nội dung hội thoại gần đây</h4>
                            <div class="space-y-2 max-h-72 overflow-y-auto pr-1">${renderMessages(ticket)}</div>
                        </div>
                        <div>
                            <h4 class="font-semibold mb-2">Lịch sử xử lý ticket</h4>
                            <div class="space-y-2 max-h-72 overflow-y-auto pr-1">${renderActivities(ticket)}</div>
                        </div>
                        <div>
                            <h4 class="font-semibold mb-2">Minh chứng của khách</h4>
                            <div class="space-y-2 max-h-72 overflow-y-auto pr-1">${renderCustomerEvidence(ticket)}</div>
                        </div>
                    </div>
                    <div class="px-5 pb-5 pt-2">
                        <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">AI đánh giá mức độ hài lòng</label>
                        <div class="flex flex-col sm:flex-row gap-2 mt-1 mb-3">
                            <input id="${aiSatId}" readonly value="${escapeHtml(aiSatText)}" class="flex-1 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none"/>
                        </div>
                        <textarea id="${noteId}" rows="2" placeholder="Ghi chú xử lý cho ticket này..." class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm outline-none"></textarea>
                    </div>
                </div>
            `;
        }

        function bindUpdateActions(scope = document) {
            scope.querySelectorAll('.btn-update').forEach((btn) => {
                btn.addEventListener('click', async () => {
                    const ticketId = Number(btn.dataset.ticketId);
                    const statusEl = document.getElementById(`status_${ticketId}`);
                    const noteEl = document.getElementById(`note_${ticketId}`);
                    const actorEl = document.getElementById(`actor_${ticketId}`);

                    const payload = {
                        status: statusEl?.value || null,
                        note: (noteEl?.value || '').trim() || null,
                        actor: (actorEl?.value || '').trim() || 'admin'
                    };

                    btn.disabled = true;
                    const originalText = btn.textContent;
                    btn.textContent = 'Đang lưu...';
                    try {
                        await updateAdminTicket(ticketId, payload);
                        alert(`Đã cập nhật ticket #${ticketId}`);
                        await loadTickets();
                    } catch (err) {
                        alert(err.message || 'Không cập nhật được ticket');
                    } finally {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    }
                });
            });

        }

        function renderCustomerDetail(customerKey) {
            const group = customerGroups.find((item) => item.key === customerKey);
            if (!group) {
                customerDetailEl.innerHTML = '<div class="text-center py-10 text-slate-500">Không tìm thấy dữ liệu khách hàng.</div>';
                return;
            }

            customerDetailEl.innerHTML = `
                <div class="border-b border-slate-200 dark:border-slate-800 pb-4 mb-4">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white">${escapeHtml(group.customerName)}</h3>
                    <p class="text-sm text-slate-500 mt-1">SĐT: ${escapeHtml(group.phoneNumber)}${group.address ? ` • Địa chỉ: ${escapeHtml(group.address)}` : ''}</p>
                    <p class="text-xs text-slate-500 mt-1">Tổng ticket: ${group.tickets.length}</p>
                </div>
                <div class="space-y-4 max-h-[68vh] overflow-y-auto pr-1">
                    ${group.tickets.map(renderTicketCard).join('')}
                </div>
            `;

            bindUpdateActions(customerDetailEl);
        }

        async function loadTickets() {
            customerListEl.innerHTML = '<div class="text-center py-10 text-slate-500">Đang tải khách hàng...</div>';
            customerDetailEl.innerHTML = '<div class="text-center py-10 text-slate-500">Đang tải lịch sử CSKH...</div>';
            const status = statusFilterEl.value;
            try {
                const tickets = await fetchAdminTickets(status);
                if (!Array.isArray(tickets) || tickets.length === 0) {
                    allTickets = [];
                    customerGroups = [];
                    selectedCustomerKey = null;
                    renderCustomerList(customerGroups);
                    return;
                }

                allTickets = tickets;
                customerGroups = buildCustomerGroups(allTickets);
                renderCustomerList(customerGroups);
            } catch (err) {
                customerListEl.innerHTML = `<div class="text-center py-10 text-red-500">Lỗi tải khách hàng: ${escapeHtml(err.message)}</div>`;
                customerDetailEl.innerHTML = '<div class="text-center py-10 text-slate-500">Không có dữ liệu lịch sử.</div>';
            }
        }

        loadTickets();
    </script>
</body>
</html>
