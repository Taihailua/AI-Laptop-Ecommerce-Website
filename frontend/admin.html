<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - Quản lý đơn hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#2b6cee", "background-light": "#f6f6f8", "background-dark": "#101622" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">

    <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-slate-900 sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
            <h1 class="text-xl font-bold">Admin Dashboard</h1>
        </div>
        <div class="flex gap-4">
            <a href="admin.html" class="text-primary font-bold border-b-2 border-primary">Đơn hàng</a>
            <a href="admin-products.html" class="text-slate-500 hover:text-primary font-medium">Sản phẩm</a>
            <button onclick="logout()" class="text-red-500 hover:text-red-600 font-medium flex items-center gap-1">
                <span class="material-symbols-outlined text-lg">logout</span> Thoát
            </button>
        </div>
    </header>

    <main class="p-6 lg:p-10 max-w-[1400px] mx-auto">
        <h2 class="text-2xl font-bold mb-6">Quản lý Đơn hàng</h2>

        <!-- Order List -->
        <div class="grid grid-cols-1 gap-6" id="order-list">
            <div class="text-center py-10 text-slate-500">Đang tải đơn hàng...</div>
        </div>
    </main>

    <script type="module">
        import { fetchAllOrders, clearAdminToken } from './api.js';

        window.logout = function() {
            clearAdminToken();
            window.location.href = 'index.html';
        }

        const StatusColors = {
            'Chờ xử lý': 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400',
            'Đang giao': 'bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-400',
            'Hoàn thành': 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400',
            'Hủy': 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400'
        };

        async function loadOrders() {
            const container = document.getElementById('order-list');
            try {
                const orders = await fetchAllOrders();
                if (!orders || !orders.length) {
                    container.innerHTML = '<div class="text-center py-10 text-slate-500">Chưa có đơn hàng nào.</div>';
                    return;
                }

                // Sort by date desc
                orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                container.innerHTML = orders.map(order => `
                    <div class="bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden transform transition-all hover:shadow-md">
                        <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-3 mb-1">
                                    <h3 class="font-bold text-lg">Đơn hàng #${order.id}</h3>
                                    <span class="px-3 py-1 rounded-full text-xs font-bold ${StatusColors[order.status] || 'bg-slate-100'}">
                                        ${order.status}
                                    </span>
                                </div>
                                <p class="text-sm text-slate-500 dark:text-slate-400">
                                    ${new Date(order.created_at).toLocaleString('vi-VN')} • Khách hàng: <span class="font-medium text-slate-900 dark:text-white">${order.customer?.full_name || 'Khách vãng lai'}</span>
                                </p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right mr-4">
                                    <p class="text-xs text-slate-500 dark:text-slate-400">Tổng tiền</p>
                                    <p class="text-xl font-bold text-primary">${new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.total_amount)}</p>
                                </div>
                                <select onchange="updateStatus(${order.id}, this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-primary">
                                    <option value="Chờ xử lý" ${order.status === 'Chờ xử lý' ? 'selected' : ''}>Chờ xử lý</option>
                                    <option value="Đang giao" ${order.status === 'Đang giao' ? 'selected' : ''}>Đang giao</option>
                                    <option value="Hoàn thành" ${order.status === 'Hoàn thành' ? 'selected' : ''}>Hoàn thành</option>
                                    <option value="Hủy" ${order.status === 'Hủy' ? 'selected' : ''}>Hủy</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Order Items -->
                        <div class="bg-slate-50 dark:bg-slate-800/30 p-4">
                            <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3 ml-2">Sản phẩm trong đơn</div>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${order.items.map(item => `
                                    <div class="flex items-center gap-3 bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                                        <div class="w-12 h-12 bg-slate-100 dark:bg-slate-700 rounded flex items-center justify-center overflow-hidden">
                                            <span class="material-symbols-outlined text-slate-400">laptop_mac</span>
                                        </div>
                                        <div>
                                            <p class="font-medium text-sm line-clamp-1">${item.product?.name || 'Sản phẩm #' + item.product_id}</p>
                                            <p class="text-xs text-slate-500">SL: ${item.quantity} x ${new Intl.NumberFormat('vi-VN').format(item.price_at_time)} ₫</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="mt-4 pt-4 border-t border-slate-200 dark:border-slate-700 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                                <div>
                                    <p class="text-slate-500 font-medium">Số điện thoại</p>
                                    <p>${order.customer?.phone_number || 'N/A'}</p>
                                </div>
                                <div>
                                    <p class="text-slate-500 font-medium">Địa chỉ giao hàng</p>
                                    <p>${order.customer?.address || 'Tại cửa hàng'}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="text-center py-10 text-red-500">Lỗi tải dữ liệu: ${e.message}</div>`;
            }
        }

        window.updateStatus = async function(orderId, newStatus) {
            if(!confirm(`Cập nhật trạng thái đơn hàng #${orderId} thành "${newStatus}"?`)) {
                loadOrders(); // Revert UI
                return;
            }
            try {
                const res = await fetch(`http://localhost:8000/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ status: newStatus })
                });
                if(res.ok) {
                    alert('Cập nhật thành công!');
                    loadOrders();
                } else {
                    alert('Lỗi cập nhật');
                }
            } catch(e) {
                alert('Lỗi kết nối: ' + e.message);
            }
        }

        loadOrders();
    </script>
</body>
</html>
