<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechBook Store - Laptops with AI Assistant</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#2b6cee",
            "background-light": "#f6f6f8",
            "background-dark": "#101622"
          },
          fontFamily: {
            display: ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"]
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen relative">
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useMemo, useRef, useState } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import {
      fetchProducts,
      Cart,
      sendAssistantMessage,
      sendChatMessage,
      checkout,
      trackOrderByPhone,
      fetchTicketDetail,
      fetchTicketsByPhone
    } from "./api.js";

    const ORDER_INTENT_REGEX = /(ch[oố]t\s*đ[ơo]n|chot\s*don|đặt\s*hàng|dat\s*hang|mua\s*ngay|mua\s*luon|thanh\s*toán|checkout)/i;
    const SELECT_PRODUCT_INTENT_REGEX = /(ch[oọ]n|l[aấ]y|đặt|mua|thêm\s*(?:v[aà]|lu[oô]n)?|chốt)(?:\s+th[uứ]\s+)?(?:m[aá]y|laptop|s[aả]n\s*ph[aẩ]m)?/i;
    const PRODUCT_ID_REGEX = /(?:\bID\s*[:#-]?\s*|\bm[aã]\s*(?:s[aả]n\s*ph[aẩ]m)?\s*[:#-]?\s*|#)(\d+)\b/gi;
    const CHECKOUT_INFO_REQUEST_REGEX = /(họ\s*và\s*tên|số\s*điện\s*thoại|địa\s*chỉ\s*(nhận\s*hàng|giao\s*hàng)|số\s*cccd|cung\s*cấp\s*(cho\s*mình\s*)?thông\s*tin|tạo\s*đơn\s*hàng|chốt\s*đơn)/i;
    const TICKET_STATUS_LABELS = {
      Moi: "Mới",
      "Dang xu ly": "Đang xử lý",
      "Da giai quyet": "Đã giải quyết",
      "Da dong": "Đã đóng"
    };
    const TICKET_CATEGORY_LABELS = {
      "Tu van san pham": "Tư vấn sản phẩm",
      "Theo doi don hang": "Theo dõi đơn hàng",
      "Doi tra hoan tien": "Đổi trả hoàn tiền",
      "Van de thanh toan": "Vấn đề thanh toán",
      "Ho tro ky thuat": "Hỗ trợ kỹ thuật",
      "Khieu nai": "Khiếu nại",
      Khac: "Khác"
    };

    function escapeHtml(text = "") {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(price) {
      return new Intl.NumberFormat("vi-VN", { style: "currency", currency: "VND" }).format(Number(price || 0));
    }

    function formatAiText(text = "") {
      return escapeHtml(text).replace(/\n/g, "<br>");
    }

    function formatDateTime(value) {
      if (!value) return "";
      try {
        return new Date(value).toLocaleString("vi-VN");
      } catch {
        return String(value);
      }
    }

    function formatTicketStatus(status) {
      return TICKET_STATUS_LABELS[status] || status || "-";
    }

    function formatTicketCategory(category) {
      return TICKET_CATEGORY_LABELS[category] || category || "-";
    }

    function formatSpecs(specs) {
      if (!specs) return "";
      if (typeof specs === "object") {
        return Object.entries(specs).map(([k, v]) => `${k}: ${v}`).join(" | ");
      }
      return String(specs);
    }

    function renderRecommendedProductsHtml(products = []) {
      if (!Array.isArray(products) || !products.length) return "";

      const cards = products.map((p) => {
        const imageNode = p.image_url
          ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.name || "Laptop")}" class="w-full h-full object-cover"/>`
          : '<span class="material-symbols-outlined text-slate-500">laptop_mac</span>';

        return `
          <a href="product-detail.html?id=${Number(p.id)}" class="block rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden bg-slate-50 dark:bg-slate-900 hover:border-primary/70 transition-colors">
            <div class="h-24 bg-slate-200 dark:bg-slate-800 flex items-center justify-center overflow-hidden">${imageNode}</div>
            <div class="p-2">
              <p class="text-xs font-semibold text-slate-900 dark:text-white line-clamp-2">${escapeHtml(p.name || "Sản phẩm")}</p>
              <p class="text-xs text-primary font-bold mt-1">${formatPrice(p.price)}</p>
            </div>
          </a>
        `;
      }).join("");

      return `<div class="mt-2 grid grid-cols-2 gap-2">${cards}</div>`;
    }

    function App() {
      const sessionId = useMemo(() => `session_${Math.random().toString(36).slice(2)}`, []);
      const searchTimerRef = useRef(null);
      const chatMessagesRef = useRef(null);
      const rememberedRecommendedProductsRef = useRef(new Map());

      const [products, setProducts] = useState([]);
      const [loadingProducts, setLoadingProducts] = useState(true);
      const [productsError, setProductsError] = useState("");
      const [search, setSearch] = useState("");
      const [cartCount, setCartCount] = useState(0);
      const [chatInput, setChatInput] = useState("");
      const [isChatMinimized, setIsChatMinimized] = useState(false);
      const [isTicketBoxMinimized, setIsTicketBoxMinimized] = useState(true);
      const [isOrderFormOpen, setIsOrderFormOpen] = useState(false);
      const [isCreatingOrder, setIsCreatingOrder] = useState(false);
      const [orderForm, setOrderForm] = useState({
        customer_name: "",
        customer_phone: "",
        customer_address: "",
        customer_cccd: ""
      });
      const [toasts, setToasts] = useState([]);
      const ticketSessionId = useMemo(() => `ticket_${Math.random().toString(36).slice(2)}`, []);
      const ticketMessagesRef = useRef(null);
      const [ticketInput, setTicketInput] = useState("");
      const [ticketPhoneLookup, setTicketPhoneLookup] = useState("");
      const [isCheckingPurchase, setIsCheckingPurchase] = useState(false);
      const [isPhoneVerified, setIsPhoneVerified] = useState(false);
      const [verifiedOrderCount, setVerifiedOrderCount] = useState(0);
      const [currentTicketId, setCurrentTicketId] = useState(null);
      const [currentTicketCategory, setCurrentTicketCategory] = useState("");
      const [currentTicketStatus, setCurrentTicketStatus] = useState("");
      const [lookupTickets, setLookupTickets] = useState([]);
      const [isLoadingLookupTickets, setIsLoadingLookupTickets] = useState(false);
      const [isLoadingTicketDetail, setIsLoadingTicketDetail] = useState(false);
      const [ticketMessages, setTicketMessages] = useState([
        {
          id: Date.now() + Math.random(),
          role: "ai",
          html: "Ticket CSKH: Vui lòng nhập số điện thoại và bấm <strong>Xác minh</strong> để kiểm tra bạn đã từng mua hàng trước khi gửi ticket."
        }
      ]);
      const [chatMessages, setChatMessages] = useState([
        {
          id: Date.now(),
          role: "ai",
          html: "Xin chào! Tôi có thể giúp bạn tìm laptop phù hợp và chốt đơn nhanh."
        }
      ]);

      function pushToast(message, type = "success") {
        const id = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
        setToasts((prev) => [...prev, { id, message, type }]);
        window.setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 3000);
      }

      function refreshCartCount() {
        const total = Cart.getAll().reduce((sum, item) => sum + Number(item.quantity || 0), 0);
        setCartCount(total);
      }

      async function loadProducts(searchText = "") {
        setLoadingProducts(true);
        setProductsError("");
        try {
          const data = await fetchProducts(searchText);
          setProducts(Array.isArray(data) ? data : []);
        } catch (err) {
          setProductsError(`Lỗi tải sản phẩm: ${err.message}. Hãy đảm bảo backend đang chạy tại localhost:8000`);
          setProducts([]);
        } finally {
          setLoadingProducts(false);
        }
      }

      useEffect(() => {
        loadProducts("");
        refreshCartCount();
      }, []);

      useEffect(() => {
        window.clearTimeout(searchTimerRef.current);
        searchTimerRef.current = window.setTimeout(() => {
          loadProducts(search.trim());
        }, 400);
        return () => window.clearTimeout(searchTimerRef.current);
      }, [search]);

      useEffect(() => {
        if (!chatMessagesRef.current) return;
        chatMessagesRef.current.scrollTop = chatMessagesRef.current.scrollHeight;
      }, [chatMessages, isOrderFormOpen, isChatMinimized]);

      useEffect(() => {
        if (!ticketMessagesRef.current) return;
        ticketMessagesRef.current.scrollTop = ticketMessagesRef.current.scrollHeight;
      }, [ticketMessages, isTicketBoxMinimized]);

      function appendUserMessage(text) {
        const safeText = escapeHtml(text);
        setChatMessages((prev) => [...prev, { id: Date.now() + Math.random(), role: "user", html: safeText }]);
      }

      function appendAiMessage(htmlText) {
        setChatMessages((prev) => [...prev, { id: Date.now() + Math.random(), role: "ai", html: htmlText }]);
      }

      function appendTicketUserMessage(text) {
        const safeText = escapeHtml(text);
        setTicketMessages((prev) => [...prev, { id: Date.now() + Math.random(), role: "user", html: safeText }]);
      }

      function appendTicketAiMessage(htmlText) {
        setTicketMessages((prev) => [...prev, { id: Date.now() + Math.random(), role: "ai", html: htmlText }]);
      }

      function openChatCheckoutForm(notifyWhenOpen = true) {
        if (isOrderFormOpen) {
          if (notifyWhenOpen) {
            appendAiMessage("Form chốt đơn đang mở. Bạn điền thông tin rồi bấm \"Xác nhận đặt hàng\" nhé.");
          }
          return false;
        }
        setIsOrderFormOpen(true);
        return true;
      }

      function shouldConvertToCheckoutForm(aiResponseText) {
        if (!aiResponseText) return false;
        const plainText = aiResponseText
          .replace(/<[^>]*>/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

        if (!CHECKOUT_INFO_REQUEST_REGEX.test(plainText)) return false;

        const requiredSignals = ["họ và tên", "số điện thoại"];
        const optionalSignals = ["địa chỉ", "cccd", "tạo đơn"];
        const requiredCount = requiredSignals.filter((k) => plainText.includes(k)).length;
        const optionalCount = optionalSignals.filter((k) => plainText.includes(k)).length;

        return requiredCount >= 2 && optionalCount >= 1;
      }

      function extractSelectedProductIds(text = "") {
        const ids = [];
        PRODUCT_ID_REGEX.lastIndex = 0;
        let match;

        while ((match = PRODUCT_ID_REGEX.exec(text)) !== null) {
          const id = Number(match[1]);
          if (!Number.isNaN(id) && !ids.includes(id)) ids.push(id);
        }
        return ids;
      }

      function getSelectedProductsFromMessage(message = "", latestRecommended = []) {
        if (!SELECT_PRODUCT_INTENT_REGEX.test(message)) return [];

        const pickedIds = extractSelectedProductIds(message);
        if (pickedIds.length) {
          return pickedIds
            .map((id) => rememberedRecommendedProductsRef.current.get(id))
            .filter(Boolean);
        }

        if (Array.isArray(latestRecommended) && latestRecommended.length === 1) {
          return [latestRecommended[0]];
        }

        return [];
      }

      function autoAddSelectedProductsFromChat(userMessage = "", latestRecommended = []) {
        const selectedProducts = getSelectedProductsFromMessage(userMessage, latestRecommended);
        if (!selectedProducts.length) return { added: [], alreadyInCart: [] };

        const cartItems = Cart.getAll();
        const added = [];
        const alreadyInCart = [];

        for (const product of selectedProducts) {
          const existed = cartItems.some((item) => item.product_id === product.id);
          if (existed) {
            alreadyInCart.push(product);
            continue;
          }
          Cart.add(product, 1);
          added.push(product);
        }

        if (added.length) refreshCartCount();

        return { added, alreadyInCart };
      }

      async function handleViewCurrentTicketDetail() {
        if (!currentTicketId) {
          appendTicketAiMessage("Hiện chưa có ticket nào trong phiên này. Bạn hãy gửi nội dung hỗ trợ để hệ thống tạo ticket.");
          return;
        }

        setIsLoadingTicketDetail(true);
        try {
          const ticket = await fetchTicketDetail(currentTicketId);
          setCurrentTicketCategory(ticket.category || "");
          setCurrentTicketStatus(ticket.status || "");

          const messageCount = Array.isArray(ticket.messages) ? ticket.messages.length : 0;
          const summaryText = ticket.ai_summary ? escapeHtml(ticket.ai_summary) : "Chưa có tóm tắt";
          appendTicketAiMessage(
            `Ticket #${ticket.id}<br>` +
              `- Chủ đề: ${escapeHtml(ticket.subject || "Yêu cầu hỗ trợ")}<br>` +
              `- Loại: ${escapeHtml(ticket.category || "OTHER")}<br>` +
              `- Trạng thái: ${escapeHtml(ticket.status || "Moi")}<br>` +
              `- Số lượt trao đổi: ${messageCount}<br>` +
              `- Tóm tắt AI: ${summaryText}`
          );
        } catch (err) {
          appendTicketAiMessage(`Không thể tải chi tiết ticket: ${escapeHtml(err.message)}`);
          pushToast("Lấy chi tiết ticket thất bại.", "error");
        } finally {
          setIsLoadingTicketDetail(false);
        }
      }

      async function handleLookupTicketByPhone() {
        const phone = ticketPhoneLookup.trim();
        if (!phone) {
          pushToast("Nhập số điện thoại để tra ticket.", "error");
          return;
        }

        setIsLoadingLookupTickets(true);
        try {
          const tickets = await fetchTicketsByPhone(phone);
          const sortedTickets = Array.isArray(tickets) ? tickets : [];
          setLookupTickets(sortedTickets);

          if (!sortedTickets.length) {
            appendTicketAiMessage(`Chưa tìm thấy ticket nào cho SĐT ${escapeHtml(phone)}.`);
            return;
          }

          const rows = sortedTickets
            .slice(0, 5)
            .map(
              (t) =>
                `#${t.id} - ${escapeHtml(t.category || "OTHER")} - ${escapeHtml(t.status || "Moi")} - ${escapeHtml(formatDateTime(t.created_at))}`
            )
            .join("<br>");
          appendTicketAiMessage(`Đã tìm thấy ${sortedTickets.length} ticket theo SĐT ${escapeHtml(phone)}:<br>${rows}`);
        } catch (err) {
          setLookupTickets([]);
          appendTicketAiMessage(`Không thể tra cứu ticket theo SĐT: ${escapeHtml(err.message)}`);
          pushToast("Tra cứu ticket thất bại.", "error");
        } finally {
          setIsLoadingLookupTickets(false);
        }
      }

      async function handleSendMessage() {
        const msg = chatInput.trim();
        if (!msg) return;

        setChatInput("");
        appendUserMessage(msg);
        const thinkingId = Date.now() + Math.random();
        setChatMessages((prev) => [...prev, { id: thinkingId, role: "ai", html: "<em>Đang suy nghĩ...</em>" }]);

        let openedByUserIntent = false;
        if (ORDER_INTENT_REGEX.test(msg)) {
          openedByUserIntent = openChatCheckoutForm(false);
        }

        try {
          const data = await sendAssistantMessage(sessionId, msg);
          const recommended = Array.isArray(data.recommended_products) ? data.recommended_products : [];

          for (const p of recommended) {
            if (p && typeof p.id === "number") {
              rememberedRecommendedProductsRef.current.set(p.id, p);
            }
          }

          const autoAddResult = autoAddSelectedProductsFromChat(msg, recommended);
          let aiHtml = "";

          if (shouldConvertToCheckoutForm(data.response)) {
            aiHtml = "Mình đã mở form chốt đơn nhanh ngay bên dưới, bạn chỉ cần điền thông tin là xong.";
            if (!openedByUserIntent) {
              openChatCheckoutForm(false);
            }
          } else {
            aiHtml = `${formatAiText(data.response)}${renderRecommendedProductsHtml(recommended)}`;
          }

          setChatMessages((prev) => prev.map((m) => (m.id === thinkingId ? { ...m, html: aiHtml } : m)));

          if (autoAddResult.added.length) {
            const names = autoAddResult.added.map((p) => p.name).join(", ");
            appendAiMessage(`Mình đã tự thêm vào giỏ: ${escapeHtml(names)}. Bạn có thể chốt đơn ngay bên dưới.`);
            pushToast(`Đã thêm ${autoAddResult.added.length} sản phẩm từ chat vào giỏ`, "success");
            openChatCheckoutForm(false);
          } else if (autoAddResult.alreadyInCart.length && ORDER_INTENT_REGEX.test(msg)) {
            appendAiMessage("Sản phẩm bạn chọn đã có trong giỏ. Mình mở form để bạn chốt đơn luôn nhé.");
            openChatCheckoutForm(false);
          }
        } catch (err) {
          setChatMessages((prev) => prev.map((m) => (m.id === thinkingId ? { ...m, html: "❌ Lỗi kết nối AI. Hãy kiểm tra backend." } : m)));
        }
      }

      async function handleVerifyTicketPhone() {
        const phone = ticketPhoneLookup.trim();
        if (!phone) {
          pushToast("Nhập số điện thoại để xác minh.", "error");
          return;
        }

        setIsCheckingPurchase(true);
        try {
          const orders = await trackOrderByPhone(phone);
          const count = Array.isArray(orders) ? orders.length : 0;

          if (!count) {
            setIsPhoneVerified(false);
            setVerifiedOrderCount(0);
            appendTicketAiMessage(`SĐT ${escapeHtml(phone)} chưa có lịch sử mua hàng tại shop, nên chưa thể tạo ticket CSKH.`);
            pushToast("SĐT chưa từng mua hàng.", "error");
            return;
          }

          setIsPhoneVerified(true);
          setVerifiedOrderCount(count);
          appendTicketAiMessage(`Đã xác minh SĐT ${escapeHtml(phone)} với ${count} đơn hàng. Bạn có thể gửi ticket hỗ trợ ngay.`);
          pushToast("Xác minh mua hàng thành công.", "success");
        } catch (err) {
          setIsPhoneVerified(false);
          setVerifiedOrderCount(0);
          appendTicketAiMessage(`Không xác minh được SĐT ${escapeHtml(phone)}: ${escapeHtml(err.message)}`);
          pushToast("Xác minh số điện thoại thất bại.", "error");
        } finally {
          setIsCheckingPurchase(false);
        }
      }

      async function handleSendTicketMessage() {
        const msg = ticketInput.trim();
        if (!msg) return;

        if (!isPhoneVerified) {
          appendTicketAiMessage("Bạn cần xác minh số điện thoại đã từng mua hàng trước khi gửi ticket.");
          return;
        }

        setTicketInput("");
        appendTicketUserMessage(msg);
        const thinkingId = Date.now() + Math.random();
        setTicketMessages((prev) => [...prev, { id: thinkingId, role: "ai", html: "<em>Đang xử lý ticket...</em>" }]);

        try {
          const data = await sendChatMessage(ticketSessionId, msg, {
            customer_phone: ticketPhoneLookup.trim(),
            customer_name: null,
            customer_address: null
          });

          if (data.ticket_id) {
            setCurrentTicketId(data.ticket_id);
            setCurrentTicketCategory(data.category || "");
            setCurrentTicketStatus(data.status || "");
          }

          const recommended = Array.isArray(data.recommended_products) ? data.recommended_products : [];
          const aiHtml = `${formatAiText(data.response)}${renderRecommendedProductsHtml(recommended)}`;
          setTicketMessages((prev) => prev.map((m) => (m.id === thinkingId ? { ...m, html: aiHtml } : m)));
        } catch (err) {
          setTicketMessages((prev) =>
            prev.map((m) =>
              m.id === thinkingId ? { ...m, html: `Không gửi được ticket: ${escapeHtml(err.message)}` } : m
            )
          );
          pushToast("Gửi ticket thất bại.", "error");
        }
      }

      function handleAddToCart(product) {
        Cart.add(product);
        refreshCartCount();
        pushToast(`Đã thêm \"${product.name}\" vào giỏ hàng!`, "success");
      }

      async function handleChatOrderSubmit(e) {
        e.preventDefault();

        const items = Cart.getAll();
        if (!items.length) {
          appendAiMessage("Giỏ hàng đang trống. Bạn thêm sản phẩm trước rồi chốt đơn nhé.");
          pushToast("Giỏ hàng trống, chưa thể tạo đơn.", "error");
          return;
        }

        const payload = {
          customer_name: orderForm.customer_name.trim(),
          customer_phone: orderForm.customer_phone.trim(),
          customer_address: orderForm.customer_address.trim() || null,
          customer_cccd: orderForm.customer_cccd.trim() || null,
          items: items.map((i) => ({ product_id: i.product_id, quantity: i.quantity }))
        };

        setIsCreatingOrder(true);
        try {
          const created = await checkout(payload);
          Cart.clear();
          refreshCartCount();
          appendAiMessage(`Đã tạo đơn thành công #${created.id}. Nhân viên sẽ liên hệ qua SĐT ${escapeHtml(payload.customer_phone)}.`);
          pushToast(`Đặt hàng thành công! Mã đơn #${created.id}`, "success");
          setIsOrderFormOpen(false);
          setOrderForm({ customer_name: "", customer_phone: "", customer_address: "", customer_cccd: "" });
        } catch (err) {
          appendAiMessage(`Không thể tạo đơn lúc này: ${escapeHtml(err.message)}`);
          pushToast("Tạo đơn thất bại, vui lòng kiểm tra lại thông tin.", "error");
        } finally {
          setIsCreatingOrder(false);
        }
      }

      return React.createElement(
        React.Fragment,
        null,
        React.createElement(
          "div",
          { className: "relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden" },
          React.createElement(
            "div",
            { className: "layout-container flex h-full grow flex-col" },
            React.createElement(
              "div",
              { className: "px-4 md:px-10 lg:px-24 xl:px-40 flex flex-1 justify-center py-5" },
              React.createElement(
                "div",
                { className: "layout-content-container flex flex-col max-w-[1200px] flex-1" },
                React.createElement(
                  "header",
                  { className: "sticky top-0 z-30 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-4 md:px-10 py-4 mb-6 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur" },
                  React.createElement(
                    "div",
                    { className: "flex items-center gap-4 md:gap-8" },

                  {
                    type: "submit",
                    className: "text-primary hover:text-primary/80 flex items-center justify-center p-1 disabled:opacity-50",
                    disabled: !isPhoneVerified
                  },
                  React.createElement("span", { className: "material-symbols-outlined text-[20px]" }, "send")
                )
              ),
              React.createElement(
                "div",
                { className: "flex gap-2" },
                React.createElement(
                  "button",
                  {
                    className: "flex-1 text-xs rounded-md border border-slate-300 dark:border-slate-600 px-2 py-1 hover:border-primary",
                    onClick: handleViewCurrentTicketDetail,
                    disabled: isLoadingTicketDetail
                  },
                  isLoadingTicketDetail ? "Đang tải..." : "Chi tiết"
                ),
                React.createElement(
                  "button",
                  {
                    className: "flex-1 text-xs rounded-md border border-slate-300 dark:border-slate-600 px-2 py-1 hover:border-primary",
                    onClick: handleLookupTicketByPhone,
                    disabled: isLoadingLookupTickets
                  },
                  isLoadingLookupTickets ? "Đang tra..." : "Lịch sử theo SĐT"
                )
              ),
              lookupTickets.length > 0 && React.createElement(
                "p",
                { className: "text-[11px] text-slate-500 dark:text-slate-400" },
                `Tìm thấy ${lookupTickets.length} ticket theo SĐT này.`
              )
            )
          )
        ),

        React.createElement(
          "div",
          { className: "fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" },
          toasts.map((toast) =>
            React.createElement(
              "div",
              {
                key: toast.id,
                className: `pointer-events-auto px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2 ${toast.type === "success" ? "bg-green-600" : "bg-red-600"}`
              },
              React.createElement("span", { className: "material-symbols-outlined text-xl" }, toast.type === "success" ? "check_circle" : "error"),
              React.createElement("span", null, toast.message)
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
