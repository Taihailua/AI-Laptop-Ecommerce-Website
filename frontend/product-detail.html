<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chi tiết sản phẩm - TechShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#2b6cee", "background-light": "#f6f6f8", "background-dark": "#101622" },
                    fontFamily: { "display": ["Plus Jakarta Sans", "ui-sans-serif", "system-ui"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 lg:px-10 py-4 bg-white dark:bg-slate-900 sticky top-0 z-40">
        <div class="flex items-center gap-4 text-primary cursor-pointer" onclick="window.location.href='index.html'">
            <span class="material-symbols-outlined text-3xl">laptop_mac</span>
            <h2 class="text-slate-900 dark:text-white text-xl font-bold">TechShop</h2>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='checkout.html'" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-2xl">shopping_cart</span>
                <span class="cart-badge absolute top-0 right-0 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full hidden"></span>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <a href="index.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-primary mb-6 transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Quay lại
        </a>

        <div id="product-detail" class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Loading State -->
            <div class="col-span-2 text-center py-20">
                <span class="material-symbols-outlined animate-spin text-4xl text-primary">progress_activity</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { Cart, fetchProducts } from './api.js';

        // Helper: Format Price
        const formatPrice = (p) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p);

        // Helper: Toast
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-lg shadow-lg text-white font-medium flex items-center gap-2 transform transition-all duration-300 translate-x-full ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.innerHTML = `<span class="material-symbols-outlined text-xl">${type === 'success' ? 'check_circle' : 'error'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Helper: Update Cart Badge
        function updateCartBadge() {
            const total = Cart.getAll().reduce((s, i) => s + i.quantity, 0);
            const badges = document.querySelectorAll('.cart-badge');
            badges.forEach(el => {
                el.textContent = total;
                el.classList.toggle('hidden', total === 0);
            });
        }

        updateCartBadge();

        // Main Logic
        function formatSpecLabel(rawKey) {
            const key = String(rawKey || '').trim();
            if (!key) return '';

            const normalized = key.toLowerCase();
            const aliasMap = {
                cpu: 'CPU',
                ram: 'RAM',
                gpu: 'GPU',
                ssd: 'SSD',
                hdd: 'HDD',
                storage: 'Ổ cứng'
            };

            if (aliasMap[normalized]) return aliasMap[normalized];
            return key;
        }

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                document.getElementById('product-detail').innerHTML = `<div class="col-span-2 text-center text-red-500">Mã sản phẩm không hợp lệ!</div>`;
                return;
            }

            try {
                // Fetch product details
                // Note: The 'fetchProducts' in api.js searches list. 
                // We need a way to get ONE product. 
                // Since api.js writes `fetchProducts(search)`, let's re-use it or fetch directly.
                // The backend has `GET /api/products/{id}`. Let's assume we can fetch it.
                
                const res = await fetch(`http://localhost:8000/api/products/${productId}`);
                if (!res.ok) throw new Error('Không tìm thấy sản phẩm');
                const product = await res.json();

                renderProduct(product);
            } catch (err) {
                document.getElementById('product-detail').innerHTML = `<div class="col-span-2 text-center text-red-500">Lỗi: ${err.message}</div>`;
            }
        }

        function renderProduct(p) {
            const container = document.getElementById('product-detail');
            
            // Render Specs
            let specsHtml = '';
            if (p.specs && typeof p.specs === 'object') {
                const validSpecs = Object.entries(p.specs)
                    .filter(([k, v]) => String(k || '').trim() && String(v || '').trim());

                specsHtml = validSpecs.map(([k, v]) => `
                    <div class="flex justify-between py-2 border-b border-slate-200 dark:border-slate-800">
                        <span class="text-slate-500 dark:text-slate-400">${formatSpecLabel(k)}</span>
                        <span class="font-medium">${v}</span>
                    </div>
                `).join('');

                if (!specsHtml) {
                    specsHtml = `<p class="text-slate-600 dark:text-slate-300">Chưa cập nhật cấu hình</p>`;
                }
            } else {
                specsHtml = `<p class="text-slate-600 dark:text-slate-300">${p.specs || 'Chưa cập nhật cấu hình'}</p>`;
            }

            container.innerHTML = `
                <!-- Left: Image -->
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 flex items-center justify-center border border-slate-200 dark:border-slate-700">
                    ${p.image_url 
                        ? `<img src="${p.image_url}" alt="${p.name}" class="max-h-[400px] object-contain w-full hover:scale-105 transition-transform duration-300">` 
                        : `<span class="material-symbols-outlined text-9xl text-slate-300">laptop_mac</span>`
                    }
                </div>

                <!-- Right: Info -->
                <div class="flex flex-col gap-6">
                    <div>
                        <h1 class="text-3xl lg:text-4xl font-bold mb-2">${p.name}</h1>
                        <p class="text-primary text-2xl font-bold">${formatPrice(p.price)}</p>
                    </div>

                    <div class="flex gap-4">
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-sm font-medium">
                            <span class="material-symbols-outlined text-base">verified</span> Chính hãng
                        </span>
                        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full ${p.stock_quantity > 0 ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700'} text-sm font-medium">
                            <span class="material-symbols-outlined text-base">inventory_2</span> ${p.stock_quantity > 0 ? `Còn ${p.stock_quantity} sản phẩm` : 'Hết hàng'}
                        </span>
                    </div>

                    <!-- Specs Box -->
                    <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl p-6 border border-slate-200 dark:border-slate-800">
                        <h3 class="font-bold text-lg mb-4 flex items-center gap-2">
                            <span class="material-symbols-outlined">memory</span> Cấu hình chi tiết
                        </h3>
                        <div class="flex flex-col gap-1">
                            ${specsHtml}
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center gap-4 mt-auto">
                        <button id="add-to-cart-btn" ${p.stock_quantity === 0 ? 'disabled' : ''} class="flex-1 bg-primary hover:bg-blue-600 text-white h-14 rounded-xl font-bold text-lg shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                            <span class="material-symbols-outlined">add_shopping_cart</span>
                            Thêm vào giỏ
                        </button>
                    </div>
                    
                    <p class="text-sm text-center text-slate-500 dark:text-slate-400">
                        <span class="material-symbols-outlined align-middle text-base mr-1">local_shipping</span> 
                        Miễn phí vận chuyển toàn quốc
                    </p>
                </div>
            `;

            // Function to handle click
            const btn = document.getElementById('add-to-cart-btn');
            if(btn) {
                btn.onclick = () => {
                    Cart.add(p);
                    updateCartBadge();
                    window.showToast(`Đã thêm ${p.name} vào giỏ!`);
                };
            }
        }

        init();
    </script>
</body>
</html>
