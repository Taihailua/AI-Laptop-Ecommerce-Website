<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tra cứu đơn hàng - TechShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#2b6cee", "background-light": "#f6f6f8", "background-dark": "#0d1117" },
                    fontFamily: { "display": ["Space Grotesk", "sans-serif"] },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-[#161b22] sticky top-0 z-50">
        <a href="index.html" class="flex items-center gap-2 text-primary hover:opacity-80 transition-opacity">
            <span class="material-symbols-outlined text-3xl">laptop_mac</span>
            <h2 class="text-xl font-bold">TechShop</h2>
        </a>
        <a href="index.html" class="font-medium hover:text-primary transition-colors">Trang chủ</a>
    </header>

    <main class="flex-grow p-6 lg:p-10 max-w-4xl mx-auto w-full flex flex-col items-center">
        
        <div class="text-center mb-10 w-full max-w-2xl">
            <h1 class="text-3xl font-bold mb-3">Tra cứu đơn hàng</h1>
            <p class="text-slate-500 dark:text-slate-400">Nhập số điện thoại bạn đã dùng để đặt hàng để kiểm tra trạng thái</p>
        </div>

        <!-- Search Box -->
        <div class="w-full max-w-lg mb-12">
            <form id="track-form" class="relative flex items-center">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-slate-400">call</span>
                </div>
                <input type="tel" id="phone-input" required pattern="[0-9]{10,11}" 
                    class="block w-full pl-10 pr-24 py-4 rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-[#161b22] shadow-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-slate-900 dark:text-white" 
                    placeholder="Số điện thoại (VD: 0901234567)">
                <button type="submit" 
                    class="absolute right-2 top-2 bottom-2 bg-primary hover:bg-blue-600 text-white font-bold rounded-lg px-6 transition-colors flex items-center gap-1">
                    Tra Cứu
                </button>
            </form>
        </div>

        <!-- Results -->
        <div id="results-area" class="w-full space-y-6 hidden">
            <!-- Content injected via JS -->
        </div>

    </main>

    <script type="module">
        import { trackOrderByPhone } from './api.js';

        // Helper: Format Currency
        const fmt = (n) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n);
        
        // Helper: Format Date
        const fmtDate = (d) => new Date(d).toLocaleString('vi-VN');

        const form = document.getElementById('track-form');
        const resultsArea = document.getElementById('results-area');

        // Check URL params
        const params = new URLSearchParams(window.location.search);
        const phoneParam = params.get('phone');
        if(phoneParam) {
            document.getElementById('phone-input').value = phoneParam;
            handleSearch(phoneParam);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone-input').value;
            handleSearch(phone);
        });

        async function handleSearch(phone) {
            resultsArea.classList.remove('hidden');
            resultsArea.innerHTML = '<div class="text-center py-10"><span class="material-symbols-outlined animate-spin text-4xl text-primary">progress_activity</span><p class="mt-2 text-slate-500">Đang tìm đơn hàng...</p></div>';

            try {
                const orders = await trackOrderByPhone(phone);
                
                if (!orders || orders.length === 0) {
                    resultsArea.innerHTML = `
                        <div class="text-center py-10 bg-white dark:bg-[#161b22] rounded-xl border border-slate-200 dark:border-slate-800">
                            <span class="material-symbols-outlined text-4xl text-slate-400 mb-2">search_off</span>
                            <p class="text-lg font-medium text-slate-900 dark:text-white">Không tìm thấy đơn hàng nào</p>
                            <p class="text-slate-500">Hãy kiểm tra lại số điện thoại của bạn.</p>
                        </div>
                    `;
                    return;
                }

                // Sort newest first
                orders.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

                resultsArea.innerHTML = `
                    <h3 class="text-xl font-bold mb-4 text-slate-900 dark:text-white">Tìm thấy ${orders.length} đơn hàng</h3>
                    ${orders.map(order => renderOrderCard(order)).join('')}
                `;

            } catch (err) {
                resultsArea.innerHTML = `
                    <div class="text-center py-10 bg-red-50 dark:bg-red-900/10 rounded-xl border border-red-200 dark:border-red-800">
                        <span class="material-symbols-outlined text-4xl text-red-500 mb-2">error</span>
                        <p class="text-red-600 font-medium">Lỗi: ${err.message}</p>
                    </div>
                `;
            }
        }

        function renderOrderCard(order) {
            let statusColor = 'text-slate-600 bg-slate-50 dark:text-slate-400 dark:bg-slate-800';
            let icon = 'info';

            if (order.status === 'Chờ xử lý') { 
                statusColor = 'text-yellow-600 bg-yellow-50 dark:text-yellow-400 dark:bg-yellow-900/20'; 
                icon = 'hourglass_empty';
            } else if (order.status === 'Đang giao') { 
                statusColor = 'text-blue-600 bg-blue-50 dark:text-blue-400 dark:bg-blue-900/20'; 
                icon = 'local_shipping';
            } else if (order.status === 'Hoàn thành') { 
                statusColor = 'text-green-600 bg-green-50 dark:text-green-400 dark:bg-green-900/20'; 
                icon = 'check_circle';
            } else if (order.status === 'Hủy') { 
                statusColor = 'text-red-600 bg-red-50 dark:text-red-400 dark:bg-red-900/20'; 
                icon = 'cancel';
            }

            return `
                <div class="bg-white dark:bg-[#161b22] border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                    <!-- Header -->
                    <div class="p-5 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex flex-wrap justify-between items-center gap-4">
                        <div class="flex items-center gap-4">
                            <div>
                                <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Mã đơn</p>
                                <p class="font-bold text-lg text-slate-800 dark:text-slate-200">#${order.id}</p>
                            </div>
                            <div class="hidden sm:block w-px h-8 bg-slate-200 dark:bg-slate-700 mx-2"></div>
                            <div>
                                <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Ngày đặt</p>
                                <p class="text-sm font-medium text-slate-600 dark:text-slate-300">${fmtDate(order.created_at)}</p>
                            </div>
                        </div>

                        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-bold ${statusColor} border border-transparent">
                            <span class="material-symbols-outlined text-[18px]">${icon}</span>
                            ${order.status}
                        </span>
                    </div>

                    <!-- Items -->
                    <div class="p-5 space-y-4">
                        ${order.items.map(item => `
                            <div class="flex gap-4 items-center border-b border-slate-100 dark:border-slate-800/50 pb-4 last:border-0 last:pb-0">
                                <div class="w-16 h-16 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex-shrink-0 flex items-center justify-center overflow-hidden p-1">
                                    ${item.product && item.product.image_url 
                                        ? `<img src="${item.product.image_url}" class="w-full h-full object-contain">` 
                                        : `<span class="material-symbols-outlined text-slate-400">laptop</span>`
                                    }
                                </div>
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-slate-800 dark:text-slate-200 text-sm sm:text-base truncate" title="${item.product?.name || 'Sản phẩm #' + item.product_id}">
                                        ${item.product?.name || 'Sản phẩm #' + item.product_id}
                                    </h4>
                                    <p class="text-sm text-slate-500">Số lượng: ${item.quantity}</p>
                                </div>
                                <div class="text-right">
                                    <p class="font-bold text-slate-800 dark:text-slate-200">${fmt(item.price_at_time)}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Footer -->
                    <div class="p-5 bg-slate-50/30 dark:bg-slate-800/20 border-t border-slate-100 dark:border-slate-800 flex justify-end items-center gap-3">
                        <span class="text-slate-500 font-medium text-sm">Tổng thanh toán:</span>
                        <span class="text-xl font-bold text-primary">${fmt(order.total_amount)}</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
